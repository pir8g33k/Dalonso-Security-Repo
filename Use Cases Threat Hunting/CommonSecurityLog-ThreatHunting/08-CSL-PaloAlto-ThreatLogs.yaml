id: b8c9d0e1-f2a3-4b4c-5d6e-7f8a9b0c1d2e
name: "Palo Alto Networks - Threat Log Events (Spyware, Wildfire, Vulnerability)"
version: 1.0.0
kind: Scheduled
description: |
  Surfaces Palo Alto Networks threat log entries for malware, spyware, wildfire,
  vulnerability and virus events that triggered more than 5 times in 24 hours. These
  indicate active detection by the firewall's content inspection engine, and repeated
  threat events from one source often mean malware activity or active C2 traffic.
  Entity mappings were previously empty, so these alerts could never populate the
  investigation graph or drive incident grouping.
  MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1071 (Application Layer Protocol)
severity: High
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CommandAndControl
relevantTechniques:
  - T1190
  - T1071
query: |
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | where DeviceVendor == "Palo Alto Networks"
  | where DeviceEventClassID has_any ("THREAT", "threat", "WILDFIRE-VIRUS", "SPYWARE", "VULNERABILITY")
      or Activity has_any ("threat", "wildfire", "spyware", "vulnerability", "virus")
  | summarize
      HitCount         = count(),
      SourceIPs        = make_set(SourceIP, 20),
      RepresentativeSourceIP = any(SourceIP),
      RepresentativeDestIP   = any(DestinationIP),
      DestinationIPs   = make_set(DestinationIP, 20),
      DestinationURLs  = make_set(RequestURL, 10),
      SeverityValues   = make_set(LogSeverity, 5),
      Actions          = make_set(DeviceAction, 5),
      FirstSeen        = min(TimeGenerated),
      LastSeen         = max(TimeGenerated)
    by Activity, DeviceEventClassID
  | where HitCount > 5
  | order by HitCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeSourceIP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeDestIP
customDetails:
  HitCount: HitCount
  Activity: Activity
  DeviceEventClassID: DeviceEventClassID
alertDetailsOverride:
  alertDisplayNameFormat: "Palo Alto Threat Alert - {{Activity}} ({{HitCount}} events)"
  alertDescriptionFormat: "Palo Alto threat signature {{Activity}} (class: {{DeviceEventClassID}}) fired {{HitCount}} times. Review for active malware, spyware, or vulnerability exploitation."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: AnyAlert
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails:
      - Activity
