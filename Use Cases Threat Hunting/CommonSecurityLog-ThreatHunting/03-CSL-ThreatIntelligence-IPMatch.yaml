id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
name: "Firewall Traffic to Threat Intelligence Flagged IP"
version: 1.0.0
kind: Scheduled
description: |
  Correlates permitted firewall traffic (Fortinet, Palo Alto, Zscaler) against active
  threat intelligence indicators. Any permitted connection to a TI-flagged IP is a
  high-confidence indicator of compromise, C2 communication, or active exploitation.
  Both sides of the join are lower-cased before comparison, because the TI feed and the
  firewall log disagree on capitalisation often enough to silently drop matches.
  The traffic window is now one hour to match the schedule, so a TI match alerts once
  when it is first seen rather than re-firing every fifteen minutes.
  MITRE ATT&CK: T1071 (Application Layer Protocol), T1078 (Valid Accounts)
severity: High
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
  - connectorId: ThreatIntelligence
    dataTypes:
      - ThreatIntelIndicators
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
  - InitialAccess
relevantTechniques:
  - T1071
  - T1078
query: |
  let TI_IPs =
      ThreatIntelIndicators
      | where TimeGenerated > ago(30d)
      | where isempty(ValidUntil) or ValidUntil > now()
      | where ObservableKey has "ip"
      | where ipv4_is_valid(ObservableValue)
      | summarize
          ThreatTypes     = make_set(tostring(Tags), 10),
          ConfidenceScore = max(Confidence),
          IndicatorIds    = make_set(tostring(Id), 5)
        by TI_IP = tolower(tostring(ObservableValue));
  CommonSecurityLog
  | where TimeGenerated > ago(1h)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
  | where isnotempty(DestinationIP) or isnotempty(SourceIP)
  | extend CheckIP = tolower(tostring(iff(ipv4_is_private(DestinationIP) == false,
                                                  DestinationIP, SourceIP)))
  | join kind=inner TI_IPs on $left.CheckIP == $right.TI_IP
  | summarize
      HitCount         = count(),
      InternalIPs      = make_set(SourceIP, 20),
      RepresentativeIP = any(SourceIP),
      DestIPs          = make_set(DestinationIP, 20),
      DeviceVendors    = make_set(DeviceVendor),
      FirstSeen        = min(TimeGenerated),
      LastSeen         = max(TimeGenerated),
      ThreatTypes      = make_set(ThreatTypes, 10),
      ConfidenceScore  = max(ConfidenceScore),
      IndicatorIds     = make_set(IndicatorIds, 5)
    by TI_IP
  | order by HitCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: TI_IP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeIP
customDetails:
  HitCount: HitCount
  ConfidenceScore: ConfidenceScore
  ThreatTypes: ThreatTypes
alertDetailsOverride:
  alertDisplayNameFormat: "TI Match - Firewall Allowed Traffic to {{TI_IP}}"
  alertDescriptionFormat: "TI-flagged IP {{TI_IP}} (confidence: {{ConfidenceScore}}) was seen in {{HitCount}} allowed firewall events. Possible C2 communication or active IOC."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
