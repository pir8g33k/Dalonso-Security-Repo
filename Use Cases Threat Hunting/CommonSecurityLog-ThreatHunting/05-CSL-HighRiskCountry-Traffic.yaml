id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b
name: "Firewall Allowed Traffic to High-Risk Country"
version: 1.0.0
kind: Scheduled
description: |
  Detects permitted inbound or outbound firewall traffic to or from countries
  frequently associated with nation-state threat actors, using ISO 3166-1 alpha-2
  country codes (CN, RU, KP, IR, SY, CU, BY, VE, AF, LY). The previous version matched
  on English country names, which does not reliably match what the geolocation
  provider actually returns.
  Both directions are now evaluated, so inbound connections from a high-risk geography
  are surfaced as well as outbound ones. This is a weak signal on its own and is
  expected to be noisy for organisations with genuine business in these regions.
  MITRE ATT&CK: T1078 (Valid Accounts), T1071 (Application Layer Protocol)
severity: Medium
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - Exfiltration
relevantTechniques:
  - T1078
query: |
  // ISO 3166-1 alpha-2 codes. Matching on the English country name was
  // unreliable - the geolocation provider returns names such as
  // "Russian Federation" and "Korea, Democratic People's Republic of".
  let HighRiskCountryCodes = dynamic([
      "CN", "RU", "KP", "IR", "SY", "CU", "BY", "VE", "AF", "LY"]);
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
  | where isnotempty(SourceIP) and isnotempty(DestinationIP)
  | extend DestCountryCode = tostring(geo_info_from_ip_address(DestinationIP).country_2)
  | extend SrcCountryCode  = tostring(geo_info_from_ip_address(SourceIP).country_2)
  | where DestCountryCode in (HighRiskCountryCodes)
       or SrcCountryCode  in (HighRiskCountryCodes)
  | summarize
      ConnectionCount  = count(),
      BytesSent        = sum(SentBytes),
      InternalIPs      = make_set(SourceIP, 20),
      ExternalIPs      = make_set(DestinationIP, 20),
      DestHostNames    = make_set(DestinationHostName, 10),
      FirstSeen        = min(TimeGenerated),
      LastSeen         = max(TimeGenerated),
      RepresentativeIP = any(SourceIP)
    by DestCountryCode, SrcCountryCode, DeviceVendor
  | order by ConnectionCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeIP
customDetails:
  ConnectionCount: ConnectionCount
  DestCountryCode: DestCountryCode
  SrcCountryCode: SrcCountryCode
alertDetailsOverride:
  alertDisplayNameFormat: "High-Risk Country Traffic Allowed - {{DestCountryCode}} ({{ConnectionCount}} connections)"
  alertDescriptionFormat: "{{ConnectionCount}} allowed firewall connections to {{DestCountryCode}} detected. Review for C2 or data exfiltration."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: AnyAlert
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails:
      - DestCountry
