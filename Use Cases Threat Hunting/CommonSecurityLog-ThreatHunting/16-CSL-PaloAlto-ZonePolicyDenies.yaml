id: d6e7f8a9-b0c1-4d2e-3f4a-5b6c7d8e9f0a
name: "Palo Alto Networks - High-Volume Inter-Zone Policy Denies"
version: 1.0.0
kind: Scheduled
description: |
  Detects high-volume Palo Alto Networks inter-zone policy deny events grouped by
  policy name and zone pair, more than 50 denies in one hour. A spike in denies against
  a specific policy may indicate a zone bypass attempt, a misconfigured application,
  or an attacker testing firewall rules from a compromised internal host. Policy
  names and zone context help separate automated tooling from legitimate traffic.
  Entity mappings were previously empty, so these alerts could never populate the
  investigation graph.
  MITRE ATT&CK: T1562 (Impair Defenses), T1046 (Network Service Discovery)
severity: Medium
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - Discovery
relevantTechniques:
  - T1562
  - T1046
query: |
  let lookback = 1h;
  let minDenies = 50;
  CommonSecurityLog
  | where TimeGenerated > ago(lookback)
  | where DeviceVendor == "Palo Alto Networks"
  | where tolower(DeviceAction) in ("deny", "drop", "reset-client", "reset-server",
                                          "reset-both", "reject", "blocked")
  | where isnotempty(DeviceCustomString1) or isnotempty(DeviceCustomString2)
  | summarize
      DenyCount        = count(),
      SourceIPs        = make_set(SourceIP, 20),
      RepresentativeSourceIP = any(SourceIP),
      RepresentativeDestIP   = any(DestinationIP),
      DestinationIPs   = make_set(DestinationIP, 20),
      Ports            = make_set(DestinationPort, 10),
      Protocols        = make_set(Protocol, 5),
      PolicyNames      = make_set(DeviceCustomString1, 10),
      SourceZones      = make_set(DeviceCustomString2, 5),
      FirstSeen        = min(TimeGenerated),
      LastSeen         = max(TimeGenerated)
    by DeviceCustomString1, DeviceCustomString2, DeviceAction
  | where DenyCount > minDenies
  | order by DenyCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeSourceIP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RepresentativeDestIP
customDetails:
  DenyCount: DenyCount
  DeviceCustomString1: DeviceCustomString1
alertDetailsOverride:
  alertDisplayNameFormat: "Palo Alto Policy Deny Spike - {{DeviceCustomString1}} ({{DenyCount}} denies)"
  alertDescriptionFormat: "Palo Alto policy {{DeviceCustomString1}} generated {{DenyCount}} deny events. High deny volume may indicate zone bypass attempts or firewall rule testing."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT6H
    matchingMethod: AnyAlert
    groupByEntities: []
    groupByAlertDetails: []
    groupByCustomDetails:
      - DeviceCustomString1
