id: b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e
name: "Correlation: Firewall Traffic + Active Security Alert - Shared IOC IP"
version: 1.0.0
kind: Scheduled
description: |
  Identifies IP addresses that appear both in active High and Medium Sentinel security
  alerts (last 7 days) and in permitted firewall traffic (last 24 hours). A flagged IP
  that is still actively communicating through the network stays a live IOC, and
  confirming that raises response priority above the alert that raised it.
  The alert side of the correlation is normalised to lower case, so addresses written
  in different case in the two sources still match.
  MITRE ATT&CK: T1078 (Valid Accounts), T1071 (Application Layer Protocol)
severity: High
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CommandAndControl
relevantTechniques:
  - T1078
  - T1071
query: |
  let AlertIPs =
      SecurityAlert
      | where TimeGenerated > ago(7d)
      | where AlertSeverity in ("High", "Medium")
      | mv-expand todynamic(Entities)
      | where Entities.Type == "ip"
      | extend AlertIP = tolower(tostring(Entities.Address))
      | where isnotempty(AlertIP)
      | summarize
          AlertCount    = count(),
          AlertNames    = make_set(AlertName, 10),
          Severities    = make_set(AlertSeverity, 3),
          Products      = make_set(ProductName, 5)
        by AlertIP;
  CommonSecurityLog
  | where TimeGenerated > ago(1d)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
  | where isnotempty(SourceIP) or isnotempty(DestinationIP)
  | extend CheckIP = tolower(tostring(iff(ipv4_is_private(DestinationIP) == false,
                                                  DestinationIP, SourceIP)))
  | summarize
      FW_HitCount     = count(),
      FW_Actions      = make_set(DeviceAction, 5),
      FW_InternalIPs  = make_set(SourceIP, 10),
      FW_Vendors      = make_set(DeviceVendor),
      FW_FirstSeen    = min(TimeGenerated),
      FW_LastSeen     = max(TimeGenerated)
    by CheckIP
  | join kind=inner AlertIPs on $left.CheckIP == $right.AlertIP
  | project
      IOC_IP        = CheckIP,
      AlertCount,
      AlertNames,
      Severities,
      Products,
      FW_HitCount,
      FW_Actions,
      FW_InternalIPs,
      FW_Vendors,
      FW_FirstSeen,
      FW_LastSeen
  | order by AlertCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IOC_IP
customDetails:
  AlertCount: AlertCount
  FW_HitCount: FW_HitCount
alertDetailsOverride:
  alertDisplayNameFormat: "Active IOC in Firewall Traffic - {{IOC_IP}} ({{AlertCount}} alerts)"
  alertDescriptionFormat: "IP {{IOC_IP}} is referenced in {{AlertCount}} Sentinel alerts and generated {{FW_HitCount}} live firewall events. Confirmed active IOC still communicating through the perimeter."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
