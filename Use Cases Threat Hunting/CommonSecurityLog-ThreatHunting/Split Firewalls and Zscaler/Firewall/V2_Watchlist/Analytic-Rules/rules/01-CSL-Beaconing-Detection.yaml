id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
name: "Firewall Beaconing Detection - Regular Outbound Connections"
version: 1.0.0
kind: Scheduled
description: |
  Detects internal hosts making regular, high-frequency connections to the same external
  IP across at least three hourly buckets - the hallmark of C2 beaconing. Queries
  Fortinet, Palo Alto and Zscaler CEF logs for PERMITTED sessions only, then scores the
  pattern as connections per hour.
  The permitted-traffic filter is a positive allow-list. FortiGate reports act=blocked
  for UTM blocks and Palo Alto and Zscaler use their own action verbs, so the previous
  deny-list was counting blocked traffic as permitted and inflating the score.
  The schedule runs every 6 hours over a 6 hour window, so the same sessions do not
  re-alert on every evaluation.
  MITRE ATT&CK: T1071 (Application Layer Protocol), T1571 (Non-Standard Port)
severity: High
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 6h
queryPeriod: 6h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
relevantTechniques:
  - T1071
  - T1571
query: |
  let lookback = 6h;
  let minConnections = 20;
  let minHourlyBuckets = 3;
  let minBeaconScore = 5.0;
  CommonSecurityLog
  | where TimeGenerated > ago(lookback)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
  | where isnotempty(SourceIP) and isnotempty(DestinationIP)
  | where ipv4_is_private(SourceIP) == true
  | where ipv4_is_private(DestinationIP) == false
  | where not(ipv4_is_in_range(DestinationIP, "100.64.0.0/10"))
  | where not(ipv4_is_in_range(DestinationIP, "169.254.0.0/16"))
  | where not(ipv4_is_in_range(DestinationIP, "224.0.0.0/4"))
  | summarize
      ConnectionCount  = count(),
      BytesSent        = sum(SentBytes),
      BytesReceived    = sum(ReceivedBytes),
      HourlyBuckets    = dcount(bin(TimeGenerated, 1h)),
      ActiveMinutes    = dcount(bin(TimeGenerated, 1m)),
      DestPorts        = make_set(DestinationPort, 10),
      DestHostNames    = make_set(DestinationHostName, 10),
      FirstSeen        = min(TimeGenerated),
      LastSeen         = max(TimeGenerated)
    by SourceIP, DestinationIP, DeviceVendor
  | where ConnectionCount > minConnections and HourlyBuckets >= minHourlyBuckets
  | extend BeaconScore = round(toreal(ConnectionCount) / toreal(HourlyBuckets), 1)
  | extend BytesPerSession = round(toreal(BytesSent) / toreal(ConnectionCount), 1)
  | where BeaconScore > minBeaconScore
  | order by BeaconScore desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: DestinationIP
customDetails:
  BeaconScore: BeaconScore
  ConnectionCount: ConnectionCount
  HourlyBuckets: HourlyBuckets
  ActiveMinutes: ActiveMinutes
alertDetailsOverride:
  alertDisplayNameFormat: "Beaconing Detected - {{SourceIP}} → {{DestinationIP}}"
  alertDescriptionFormat: "Internal host {{SourceIP}} made {{ConnectionCount}} connections to external IP {{DestinationIP}} with a regular interval pattern (beacon score: {{BeaconScore}})."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT6H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
