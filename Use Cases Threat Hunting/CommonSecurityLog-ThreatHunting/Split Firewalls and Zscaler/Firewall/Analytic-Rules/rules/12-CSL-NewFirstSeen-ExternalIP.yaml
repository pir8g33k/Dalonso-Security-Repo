id: f2a3b4c5-d6e7-4f8a-9b0c-1d2e3f4a5b6c
name: "Firewall New First-Seen External IP Contacted"
version: 1.0.0
kind: Scheduled
description: |
  Identifies external IPs that received more than 5 permitted firewall connections in
  the last 6 hours but were not observed at all during the prior 30-day baseline.
  A newly appearing external IP with real connection volume may be freshly registered
  attacker infrastructure, a newly activated C2 domain, or an exfiltration channel
  set up after initial compromise.
  The recent window now matches the schedule exactly. Previously the rule compared a
  24 hour recent window against a 7 day baseline on a 6 hour schedule, so the same
  new IP re-alerted on every run for a full day.
  MITRE ATT&CK: T1071 (Application Layer Protocol)
severity: Medium
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
queryFrequency: 6h
queryPeriod: 6h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
relevantTechniques:
  - T1071
query: |
  let lookback = 6h;
  let historyWindow = 30d;
  let minConnections = 5;
  let HistoricalIPs =
      CommonSecurityLog
      | where TimeGenerated between (ago(historyWindow) .. ago(lookback))
      | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
      | where isnotempty(DestinationIP)
      | where ipv4_is_private(DestinationIP) == false
      | summarize by DestinationIP;
  CommonSecurityLog
  | where TimeGenerated > ago(lookback)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
  | where isnotempty(DestinationIP)
  | where ipv4_is_private(DestinationIP) == false
  | summarize
      ConnectionCount  = count(),
      SourceIPs        = make_set(SourceIP, 20),
      BytesSent        = sum(SentBytes),
      Ports            = make_set(DestinationPort, 10),
      Protocols        = make_set(Protocol, 5),
      DeviceVendors    = make_set(DeviceVendor),
      FirstSeen        = min(TimeGenerated)
    by DestinationIP
  | where ConnectionCount > minConnections
  | join kind=leftanti HistoricalIPs on DestinationIP
  | order by ConnectionCount desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: DestinationIP
customDetails:
  ConnectionCount: ConnectionCount
alertDetailsOverride:
  alertDisplayNameFormat: "First-Seen External IP - {{DestinationIP}} ({{ConnectionCount}} connections)"
  alertDescriptionFormat: "External IP {{DestinationIP}} received {{ConnectionCount}} allowed firewall connections in the last 24 hours but was not seen in the prior 7-day baseline. Possible new attacker infrastructure."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
