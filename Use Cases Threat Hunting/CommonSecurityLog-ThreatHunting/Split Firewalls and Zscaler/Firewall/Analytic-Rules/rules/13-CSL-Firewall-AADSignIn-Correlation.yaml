id: a3b4c5d6-e7f8-4a9b-0c1d-2e3f4a5b6c7d
name: "Correlation: Firewall Allowed Traffic + Azure AD Sign-In from Same IP"
version: 1.0.0
kind: Scheduled
description: |
  Correlates permitted firewall traffic with Azure AD sign-in events sharing the same
  external IP. An IP that appears in both Entra sign-in logs and firewall sessions at
  the same time may indicate a threat actor reusing the same infrastructure for
  credential-based cloud access and network-level collection. The correlation turns
  two low-confidence signals into one high-confidence cross-vector indicator.
  Two corrections were required. ResultType is a string column in SigninLogs, so the
  previous integer comparison never matched and the join was always empty. Both
  sides of the join are now lower-cased before comparison.
  MITRE ATT&CK: T1078 (Valid Accounts)
severity: High
requiredDataConnectors:
  - connectorId: CommonSecurityEvents
    dataTypes:
      - CommonSecurityLog
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - DefenseEvasion
relevantTechniques:
  - T1078
query: |
  let FirewallExternalIPs =
      CommonSecurityLog
      | where TimeGenerated > ago(1d)
      | where DeviceVendor in ("Fortinet", "Palo Alto Networks", "Zscaler")
  // Positive allow-list. FortiGate emits act=blocked for UTM blocks and
  // Palo Alto / Zscaler use their own action verbs, so the previous
  // deny-list silently counted blocked traffic as permitted.
  | where tolower(DeviceAction) in ("accept", "allowed", "allow")
      | where isnotempty(DestinationIP)
      | where ipv4_is_private(DestinationIP) == false
      | summarize
          FW_Connections = count(),
          FW_Sources     = make_set(SourceIP, 10),
          FW_BytesSent   = sum(SentBytes),
          FW_Vendors     = make_set(DeviceVendor)
        by ExternalIP = tolower(tostring(DestinationIP));
  SigninLogs
  | where TimeGenerated > ago(1d)
  // ResultType is a string column; the previous integer comparison never matched,
  // which meant the join was always empty and the rule could never fire.
  | where tostring(ResultType) == "0"
  | where isnotempty(IPAddress)
  | summarize
      AAD_SignInCount  = count(),
      AAD_Users        = make_set(UserPrincipalName, 20),
      AAD_AppNames     = make_set(AppDisplayName, 10),
      AAD_Countries    = make_set(Location, 5),
      AAD_RiskLevels   = make_set(RiskLevelDuringSignIn, 5)
    by IPAddress = tolower(tostring(IPAddress))
  | join kind=inner FirewallExternalIPs on $left.IPAddress == $right.ExternalIP
  | project
      IPAddress,
      AAD_SignInCount,
      AAD_Users,
      AAD_Countries,
      AAD_RiskLevels,
      FW_Connections,
      FW_Sources,
      FW_BytesSent,
      FW_Vendors
  | order by FW_Connections desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  AAD_SignInCount: AAD_SignInCount
  FW_Connections: FW_Connections
alertDetailsOverride:
  alertDisplayNameFormat: "Cross-Signal IP Match - {{IPAddress}} in Firewall + AAD Sign-In"
  alertDescriptionFormat: "IP {{IPAddress}} generated {{AAD_SignInCount}} AAD sign-ins and {{FW_Connections}} firewall sessions. Multi-vector activity from a single source is a strong compromise indicator."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT12H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
